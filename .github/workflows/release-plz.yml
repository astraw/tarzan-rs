name: release-plz

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

jobs:
  # Opens (or updates) a "release PR" that bumps crate versions and
  # regenerates CHANGELOG.md from the Conventional Commit history.
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # When a release PR is merged, publishes the changed crates to
  # crates.io and creates git tags + GitHub releases. On ordinary
  # pushes this job is a no-op.
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # A Personal Access Token is required here instead of GITHUB_TOKEN.
          # GitHub Actions will not trigger other workflow runs (e.g. cargo-dist)
          # from events caused by the built-in GITHUB_TOKEN. The PAT must have
          # `contents: write` and `pull-requests: write` scopes, and should be
          # stored as a repository secret named RELEASE_PLZ_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

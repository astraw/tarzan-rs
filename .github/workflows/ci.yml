name: CI

on:
  push:
  pull_request:

jobs:
  # Linux carries the OS-agnostic checks (fmt, clippy, the
  # THIRD-PARTY-LICENSES libzstd sanity check) on top of the test suite.
  # The macOS and Windows jobs run the test suite only. The macOS job also
  # exercises the host bsdtar (tests/bsdtar_macos.rs); on Windows the tests
  # that shell out to `tar` use the bsdtar that ships in System32.
  check:
    name: lint + test (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify THIRD-PARTY-LICENSES retains the libzstd entry
        run: |
          if ! grep -q '^- package_name: libzstd$' THIRD-PARTY-LICENSES \
             || ! grep -q 'Copyright (c) Meta Platforms' THIRD-PARTY-LICENSES; then
            echo "::error::THIRD-PARTY-LICENSES is missing the hand-maintained libzstd entry — re-add it after regenerating (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

  # Produce-anywhere, consume-anywhere: each OS archives a source tree with
  # its host tar and wraps it; then each OS lists, verifies, and extracts
  # every producer's archive. tests/cross_host.rs asserts content lands
  # byte-exact and that whatever could not be restored is a predicted kind.
  cross-host-produce:
    name: produce (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build tarzan
        run: cargo build --release

      - name: Produce archives with the host tar
        shell: bash
        run: |
          BIN=target/release/tarzan
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          python ci/produce.py cross-host-out "$BIN"
          cat cross-host-out/manifest.json

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: cross-host-${{ matrix.os }}
          path: cross-host-out
          retention-days: 1
          if-no-files-found: error

  cross-host-consume:
    name: consume (${{ matrix.os }})
    needs: cross-host-produce
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download every producer's archives
        uses: actions/download-artifact@v8
        with:
          pattern: cross-host-*
          path: cross-host-in

      - name: Consume
        shell: bash
        env:
          CROSS_HOST_DIR: ${{ github.workspace }}/cross-host-in
        run: cargo test --test cross_host -- --ignored --nocapture

  # Runs cargo-semver-checks against the last version tag.  If a breaking
  # API change is detected, the job requires at least one commit since that
  # tag to acknowledge it with feat!:, fix!:, or a BREAKING CHANGE footer.
  semver-check:
    name: semver compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check for undeclared breaking changes
        run: |
          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No prior version tag; skipping semver check."
            exit 0
          fi
          echo "Comparing against $LAST_TAG"
          if cargo semver-checks check-release --baseline-rev "$LAST_TAG"; then
            exit 0
          fi
          # cargo-semver-checks found a breaking change.  Acceptable only when the
          # conventional-commit history since the last tag acknowledges it.
          COMMITS=$(git log "${LAST_TAG}..HEAD" --format="%s%n%b")
          if echo "$COMMITS" | grep -qE '^(feat|fix|[a-z]+)(\([^)]*\))?!:|BREAKING[ -]CHANGE'; then
            echo "Breaking change is acknowledged in commit history — version bump required."
            exit 0
          fi
          echo "::error::cargo-semver-checks found a breaking API change not acknowledged"
          echo "::error::in any commit since ${LAST_TAG}.  Add feat!: / fix!: or a"
          echo "::error::BREAKING CHANGE footer to the responsible commit, or revert the break."
          exit 1

  # Tests that touch Unix-only APIs (symlink creation, MetadataExt mtime,
  # Unix permission bits) are gated with `#[cfg(unix)]` and don't compile
  # in here. The remaining tests shell out to `tar`, which Windows
  # provides as bsdtar.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

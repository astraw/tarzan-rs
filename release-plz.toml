# release-plz configuration — https://release-plz.dev/docs/config
#
# release-plz opens a release PR, publishes the `tarzan` crate to
# crates.io, and pushes a git tag. Building platform binaries and
# creating the GitHub release is delegated to cargo-dist, whose workflow
# triggers on the tag that release-plz pushes.

[workspace]
# Version is bumped from the crate's Conventional Commit history.
git_tag_enable = true
# cargo-dist creates the GitHub release with the built binaries
# attached, so release-plz must not also create one.
git_release_enable = false
# Custom git-cliff config: feat: triggers patch, not minor (pre-1.0 policy).
changelog_config = "cliff.toml"

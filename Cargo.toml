[package]
name = "tarzan"
version = "0.1.1"
description = "Random-access, seekable .tar.zst archives with an embedded table-of-contents index"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/astraw/tarzan-rs"
authors = ["Andrew Straw"]
keywords = ["tar", "zstd", "archive", "compression", "seekable"]
categories = ["compression", "filesystem", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
zstd = "0.13"

# Used only for `localtime_r` in `tarzan list -v` timestamp formatting,
# which is gated to `#[cfg(unix)]`; Windows builds do not need it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.12"

[[bin]]
name = "tarzan"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

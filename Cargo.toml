[package]
name = "tarzan"
version = "0.3.0"
description = "Random-access, seekable .tar.zst archives with an embedded table-of-contents index"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/astraw/tarzan-rs"
authors = ["Andrew Straw"]
keywords = ["tar", "zstd", "archive", "compression", "seekable"]
categories = ["compression", "filesystem", "command-line-utilities"]

[features]
default = ["zstd-sys"]
zstd-sys = ["dep:zstd"]
pure-rust = ["dep:zstd-pure-rs"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
sha2 = "0.10"
# default-features = false drops the xattr feature, which would pull in the
# xattr + rustix + bitflags + errno chain. We only use tar's Archive (read
# side) and Builder::append_data (test side); neither reads extended
# attributes.
tar = { version = "0.4", default-features = false }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
zstd = { version = "0.13", optional = true }
zstd-pure-rs = { version = "0.1", optional = true }

# Used only for `localtime_r` in `tarzan list -v` timestamp formatting,
# which is gated to `#[cfg(unix)]`; Windows builds do not need it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.12"
zstd = "0.13"
zstd-pure-rs = "0.1"

[[bin]]
name = "tarzan"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
